<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>PL 5v5 Manager 2.0</title>
<style>
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--bg:#0b0f17;--panel:#141a26;--panel2:#1b2333;--line:#27324a;--txt:#e8edf7;--mut:#8e9bb4;--acc:#22d37a;--acc2:#7c5cff;--gold:#ffcf4a;--red:#ff5c6c;--blue:#4aa3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 600px at 10% -10%,#17315a55,transparent),radial-gradient(900px 500px at 100% 0,#4b2a8a44,transparent),var(--bg);background-attachment:fixed}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
#app{max-width:1040px;margin:0 auto;padding:12px 12px 96px}
h1,h2,h3{margin:0}
.btn{background:linear-gradient(135deg,var(--acc),#12a85c);color:#04210f;font-weight:700;padding:11px 18px;border-radius:12px;box-shadow:0 6px 18px #22d37a33;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:none}
.btn.sec{background:var(--panel2);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.btn.sec.on{border-color:var(--acc);color:var(--acc)}
.btn.warn{background:linear-gradient(135deg,#ffb84a,#ff8a3a);color:#2b1300}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 4px;text-transform:uppercase;letter-spacing:.06em}
input[type=text],select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input[type=text]:focus,select:focus{border-color:var(--acc)}
input[type=color]{width:100%;height:42px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
.logo{font-weight:900;font-size:clamp(26px,6vw,44px);letter-spacing:-.02em;background:linear-gradient(90deg,#fff,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{font-size:.4em;vertical-align:super;color:var(--gold);-webkit-text-fill-color:var(--gold)}
.hero{text-align:center;padding:22px 8px 10px}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:620px){.diffs{grid-template-columns:1fr}}
.diff{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;transition:border-color .15s}
.diff.on{border-color:var(--acc);box-shadow:0 0 0 3px #22d37a22}
.diff b{display:block;font-size:17px}
.diff ul{margin:6px 0 0;padding-left:16px;color:var(--mut);font-size:13px}
.err{color:var(--red);min-height:20px;margin:8px 0}
.badge{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--cc,#666);color:#fff;font-weight:800;font-size:11px;border:2px solid #ffffff55;text-shadow:0 1px 2px #0008;flex:none}
.badge.big{width:48px;height:48px;font-size:14px}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.top .who{display:flex;align-items:center;gap:10px;min-width:0}
.top .who b{display:block;font-size:17px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);padding:5px 10px;border-radius:999px;font-size:13px;white-space:nowrap}
.chip b{color:var(--gold)}
nav.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:12px;position:sticky;top:6px;z-index:20}
nav.tabs button{flex:1;background:transparent;color:var(--mut);padding:9px 2px;border-radius:10px;font-size:13px;font-weight:600;transition:background .15s,color .15s}
nav.tabs button.on{background:var(--panel2);color:#fff;box-shadow:inset 0 0 0 1px var(--acc)}
@media(max-width:760px){nav.tabs{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));top:auto;margin:0;z-index:30;box-shadow:0 8px 30px #000a}nav.tabs button{font-size:10px}nav.tabs button span{display:block;font-size:18px}}
@media(min-width:761px){nav.tabs button span{margin-right:4px}}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pill{background:var(--panel2);border:1px solid var(--line);padding:6px 11px;border-radius:999px;font-size:13px;cursor:pointer}
.pill.on{border-color:var(--acc);color:var(--acc)}
/* ---------- CARTES ---------- */
.cards{display:flex;gap:clamp(5px,1.6vw,18px);justify-content:center;font-size:clamp(8px,2.4vw,14px);margin:14px 0}
.cards.scroll{font-size:11px;justify-content:flex-start;overflow-x:auto;padding:14px 6px 18px;scroll-snap-type:x proximity}
.cards.scroll .card{flex:none;scroll-snap-align:center}
.card{position:relative;width:12.5em;aspect-ratio:5/7.3;border-radius:1em;padding:.7em;display:flex;flex-direction:column;background:linear-gradient(160deg,#2b3140,#141821);border:.16em solid #8b94a7;color:#fff;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;
 animation:dealIn .7s cubic-bezier(.2,.9,.3,1.2) calc(var(--i,0)*.16s) backwards;
 transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
 transition:transform .16s ease-out,translate .2s,scale .2s,box-shadow .2s;box-shadow:0 .6em 1.4em #0008;will-change:transform;contain:layout paint}
.card:hover{translate:0 -.5em;scale:1.04}
.card.static{animation:none;cursor:default}
.card.static:hover{translate:none;scale:1}
@keyframes dealIn{from{opacity:0;transform:translateY(5em) rotateY(100deg) scale(.7)}to{opacity:1;transform:none}}
.card.picked{animation:pickd .55s forwards}
.card.dismissed{animation:dismiss .5s forwards}
@keyframes pickd{to{transform:translateY(-2em) scale(1.12);box-shadow:0 0 3em var(--acc)}}
@keyframes dismiss{to{opacity:0;transform:translateY(2em) scale(.8)}}
.card.locked{filter:grayscale(.9) brightness(.6);cursor:not-allowed}
.card.shake{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-.5em)}75%{transform:translateX(.5em)}}
.card .ctop{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.card .gen{font-size:2.5em;font-weight:900;line-height:1;text-shadow:0 .05em .3em #000a}
.card .potb{display:block;font-size:.72em;font-weight:800;margin-top:.15em;opacity:.9;letter-spacing:.02em}
.card .potb.up{color:#7dffb4}
.card .pos{text-align:center;font-size:1.5em;line-height:1}
.card .pos small{display:block;font-size:.45em;font-weight:800;opacity:.8;margin-top:.15em}
.card .avwrap{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;position:relative;z-index:1;margin:-.3em 0 0}
.card .avwrap svg{width:78%;height:auto;max-height:100%;filter:drop-shadow(0 .3em .4em #000a)}
.card .avwrap::before{content:"";position:absolute;inset:8% 8% 0;border-radius:50% 50% 0 0;background:radial-gradient(circle at 50% 30%,var(--cc),transparent 70%);opacity:.55}
.card .cname{font-weight:800;font-size:1.15em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:2;margin-top:.2em}
.card .cclub{font-size:.85em;text-align:center;color:#ccd3e2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:2}
.card .cfoot{display:flex;justify-content:space-between;align-items:center;font-size:.9em;margin-top:.4em;position:relative;z-index:2;border-top:1px solid #ffffff30;padding-top:.35em}
.card .cfoot .rar{font-size:.8em;text-transform:uppercase;letter-spacing:.06em;font-weight:800;opacity:.9}
.card .cfoot b{color:var(--gold)}
.card .shine{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.card .shine::before{content:"";position:absolute;top:-50%;left:-90%;width:55%;height:200%;background:linear-gradient(90deg,transparent,#fff5,transparent);transform:rotate(20deg);animation:sweep 3.6s infinite}
.card.common .shine{display:none}
@keyframes sweep{0%{left:-90%}55%,100%{left:160%}}
.card .glare{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),#ffffff66,transparent 48%);mix-blend-mode:overlay;opacity:0;transition:opacity .2s}
.card:hover .glare{opacity:1}
.card.limited{border-color:#f5c518;background:linear-gradient(160deg,#4d4010,#17130a)}
.card.rare{border-color:#ff4d5e;background:linear-gradient(160deg,#59182a,#170810);box-shadow:0 .6em 1.6em #ff4d5e44}
.card.epic{border-color:#a78bfa;background:linear-gradient(160deg,#2e1d63,#0e0a24);box-shadow:0 0 1.6em #7c5cffaa}
.card.epic::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(115deg,#ff008033,#00ffd533,#ffe60033,#7c5cff33,#ff008033);background-size:300% 300%;mix-blend-mode:screen;animation:holo 5s linear infinite}
@keyframes holo{to{background-position:300% 0}}
.card.legend{border-color:var(--gold);background:linear-gradient(160deg,#6b4a07,#1d1303 70%);animation:dealIn .7s cubic-bezier(.2,.9,.3,1.2) calc(var(--i,0)*.16s) backwards,glow 2s ease-in-out infinite alternate}
.card.legend.static{animation:glow 2s ease-in-out infinite alternate}
.card.legend .shine::before{animation-duration:2.2s;background:linear-gradient(90deg,transparent,#ffe9a0aa,transparent)}
@keyframes glow{from{box-shadow:0 0 1em #ffcf4a88,0 0 2em #ff9a0044}to{box-shadow:0 0 2.2em #ffcf4add,0 0 4.5em #ff9a0088}}
.card.legend::before,.card.epic::before,.card.prospect::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:.2em;z-index:6;pointer-events:none;
 background:conic-gradient(from var(--ang),var(--b1),var(--b2),var(--b1) 40%,var(--b2) 70%,var(--b1));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;animation:spin 3.2s linear infinite}
.card.legend{--b1:#ffcf4a;--b2:#fff6c8}
.card.epic{--b1:#7c5cff;--b2:#5ee7ff}
.card.prospect{--b1:#22d37a;--b2:#5ee7ff;border-color:#22d3a0;box-shadow:0 0 1.2em #22d3a066}
@keyframes spin{to{--ang:360deg}}
.card .bolts{position:absolute;inset:0;z-index:4;pointer-events:none}
.card .bolts svg{position:absolute;width:3em;height:5em;fill:#fff3b0;filter:drop-shadow(0 0 .4em #ffd000);animation:zap 1.6s infinite}
.card .bolts svg:nth-child(1){left:-.2em;top:30%}
.card .bolts svg:nth-child(2){right:-.2em;top:50%;transform:scaleX(-1);animation-delay:.7s}
@keyframes zap{0%,60%,100%{opacity:0}65%{opacity:1}70%{opacity:.2}75%{opacity:1}85%{opacity:0}}
.card .spk{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.card .spk i{position:absolute;bottom:-.4em;width:.32em;height:.32em;border-radius:50%;background:#fff;box-shadow:0 0 .5em 0 var(--b1,#ffe9a0);opacity:0;animation:rise 3s linear infinite}
@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:.95}100%{transform:translateY(-14em) scale(1.1);opacity:0}}
.card .ribbon{position:absolute;top:42%;left:-25%;right:-25%;transform:rotate(-12deg);background:#d3263a;color:#fff;text-align:center;font-weight:800;z-index:7;font-size:.95em;padding:.25em 0;box-shadow:0 .2em .8em #000a}
.card .ribbon.sus{background:#c9a400;color:#1c1400}
.cardcell{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:clamp(8px,2.4vw,14px)}
.cardcell .btn{font-size:1.3em;padding:.55em .9em}
.cardcell .btn[disabled]{opacity:.35}
/* ---------- TERRAIN ---------- */
.pitch{position:relative;border-radius:16px;padding:16px 6px;background:repeating-linear-gradient(0deg,#1d7a3b 0 38px,#22883f 38px 76px);border:2px solid #ffffff33;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.pitch::before{content:"";position:absolute;left:50%;top:50%;width:90px;height:90px;border:2px solid #ffffff44;border-radius:50%;transform:translate(-50%,-50%)}
.pitch::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #ffffff44}
.prow{display:flex;justify-content:space-around;align-items:flex-start;position:relative;z-index:1;min-height:76px}
.pl{width:84px;text-align:center}
.plav{position:relative;width:52px;height:52px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 50% 30%,var(--cc,#555),#000a);border:2px solid #fff;overflow:hidden}
.plav svg{width:100%;height:100%;margin-top:4px}
.plg{position:absolute;right:-2px;bottom:-2px;background:#000c;border:1px solid #fff6;border-radius:8px;font-size:10px;font-weight:800;padding:0 4px}
.pln{font-size:11px;font-weight:700;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pl.empty .plav{background:#0003;border:2px dashed #fff8;display:flex;align-items:center;justify-content:center;font-size:22px}
.pl .st{position:absolute;left:-3px;top:-3px;font-size:14px;z-index:2}
.fmdot{display:inline-block;font-size:10px;margin-left:2px}
/* ---------- TABLES ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase}
td.l,th.l{text-align:left}
tr.me td{background:#22d37a1c;font-weight:700}
tr.z1 td:first-child{box-shadow:inset 3px 0 var(--blue)}
tr.z2 td:first-child{box-shadow:inset 3px 0 var(--gold)}
tr.z3 td:first-child{box-shadow:inset 3px 0 var(--red)}
td .tn{display:inline-flex;align-items:center;gap:6px}
td .badge{width:20px;height:20px;font-size:0;border-width:1px}
@media(max-width:620px){.hm{display:none}}
/* ---------- MATCH ---------- */
.sb{display:flex;align-items:center;justify-content:center;gap:12px;text-align:center}
.sb .tn{flex:1;font-weight:800;font-size:clamp(13px,3.6vw,18px)}
.sb .sc{font-size:clamp(26px,8vw,40px);font-weight:900;background:var(--panel2);padding:4px 16px;border-radius:12px;border:1px solid var(--line);min-width:110px;font-variant-numeric:tabular-nums}
.sc.pulse{animation:pulse .7s}
@keyframes pulse{30%{transform:scale(1.25);background:#22d37a55}}
.clock{text-align:center;color:var(--acc);font-weight:700;margin:6px 0;font-variant-numeric:tabular-nums}
.feed{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.ev{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border-left:4px solid var(--tc,#555);border-radius:8px;padding:7px 9px;font-size:13.5px;animation:slideIn .3s}
.ev.goal{background:linear-gradient(90deg,#22d37a33,var(--panel2));font-weight:600}
.ev.red{background:linear-gradient(90deg,#ff5c6c33,var(--panel2))}
.ev.inj{background:linear-gradient(90deg,#ffb84a2a,var(--panel2))}
.ev.sys{border-left-color:var(--mut);color:var(--mut);justify-content:center;font-size:12px}
.ev .min{color:var(--mut);min-width:30px;font-variant-numeric:tabular-nums}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.bar .k{width:34px;color:var(--mut);font-weight:700}
.bar .tr{flex:1;height:9px;background:#0006;border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:6px;background:var(--acc)}
.bar .tr.o i{background:var(--red)}
.bar .tr.y i{background:var(--gold)}
.bar .v{width:26px;text-align:right}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.note{font-size:13px;margin:3px 0}
.note.ok{color:var(--acc)}.note.ko{color:var(--red)}.note.nt{color:var(--gold)}
.prow2{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:8px;margin-bottom:6px}
.prow2 .plav{width:44px;height:44px;flex:none}
.prow2 .i{flex:1;min-width:0}
.prow2 .i b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow2 select{width:auto;max-width:48%;padding:6px 8px;font-size:12px}
.gbox{display:inline-block;min-width:34px;text-align:center;font-weight:900;border-radius:8px;padding:2px 6px;background:#0006}
.modal{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:460px;width:100%;max-height:85vh;overflow:auto}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#111e;border:1px solid var(--acc);padding:10px 16px;border-radius:12px;z-index:80;animation:slideIn .3s;max-width:92vw;text-align:center}
.toast.bad{border-color:var(--red)}
.big{font-size:clamp(20px,5vw,30px);font-weight:900}
.formsel{display:flex;gap:6px;flex-wrap:wrap}
details{background:var(--panel2);border-radius:10px;padding:8px 10px;margin-bottom:6px}
summary{cursor:pointer;font-weight:600}
.progress{display:flex;gap:6px;justify-content:center;margin:8px 0}
.progress i{width:34px;height:6px;border-radius:4px;background:var(--line)}
.progress i.done{background:var(--acc)}
.progress i.cur{background:var(--gold)}
/* ---------- FORME & STATUT ---------- */
.fm{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:#0005;border:1px solid var(--line);white-space:nowrap}
.fm.fire{color:#ff9a3a;border-color:#ff9a3a}.fm.good{color:var(--acc);border-color:var(--acc)}.fm.low{color:#ffb84a;border-color:#ffb84a}.fm.tired{color:var(--red);border-color:var(--red)}
.st-out{color:var(--red);font-weight:700}
.meter{height:10px;background:#0006;border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc),#7dffb4);transition:width .4s}
.meter.pot i{background:linear-gradient(90deg,#4aa3ff,#7c5cff)}
.meter.fat i{background:linear-gradient(90deg,#ffb84a,var(--red))}
.sqrow{display:grid;grid-template-columns:48px 1fr;gap:10px;background:var(--panel2);border-radius:12px;padding:10px;margin-bottom:8px;align-items:center}
.sqrow .plav{width:48px;height:48px}
.sqrow .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;font-size:12px}
@media(max-width:620px){.sqrow .cols{grid-template-columns:1fr 1fr}}
/* ---------- TACTIQUE ---------- */
.ins{background:var(--panel2);border-radius:10px;padding:8px 10px}
.ins label{margin:0 0 4px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--txt);font-weight:600}
.ins select{padding:7px 9px;font-size:13px}
.ins.mod{box-shadow:inset 3px 0 var(--acc2)}
.insgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:700px){.insgrid{grid-template-columns:1fr}}
.efs{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px;min-height:18px}
.ef{font-size:10.5px;padding:1px 6px;border-radius:6px;background:#0005}
.ef.pos{color:var(--acc)}.ef.neg{color:#ff8a96}
.scout{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.scout{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0;border-bottom:1px dashed #ffffff14}
.kv span:first-child{color:var(--mut)}
.kv span:last-child{text-align:right}
.alert{background:linear-gradient(90deg,#ff5c6c22,var(--panel2));border:1px solid #ff5c6c66;border-radius:12px;padding:10px;margin-bottom:10px;font-size:13.5px}
.obj{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:10px;margin-bottom:6px}
.obj .ic{font-size:22px}
.obj.ok{box-shadow:inset 3px 0 var(--acc)}.obj.ko{box-shadow:inset 3px 0 var(--red)}.obj.run{box-shadow:inset 3px 0 var(--gold)}
.news{font-size:13px;padding:6px 0;border-bottom:1px dashed #ffffff14}
/* ---------- LIVE / BUT ---------- */
.livebox{position:relative;overflow:hidden}
.livebox.shake{animation:shakeP .5s}
@keyframes shakeP{10%{transform:translate(-5px,3px)}30%{transform:translate(5px,-3px)}50%{transform:translate(-4px,-2px)}70%{transform:translate(3px,3px)}100%{transform:none}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:10;display:none}
.fx.on{display:block}
.fx .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#fff,var(--tc) 50%,transparent 80%);opacity:0;animation:flash .6s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:.85}100%{opacity:0}}
.fx .banner{position:absolute;left:0;right:0;top:50%;margin-top:-62px;height:124px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
 background:linear-gradient(90deg,transparent,var(--tc) 14%,var(--tc) 86%,transparent);box-shadow:0 0 40px var(--tc);animation:bnr 2.3s cubic-bezier(.2,.9,.2,1) forwards;will-change:transform,opacity}
@keyframes bnr{0%{transform:translateX(-110%) skewX(-12deg);opacity:0}14%{transform:translateX(0) skewX(0);opacity:1}86%{transform:translateX(0);opacity:1}100%{transform:translateX(110%) skewX(12deg);opacity:0}}
.fx .gl{font-size:clamp(28px,8vw,46px);font-weight:900;letter-spacing:.08em;color:#fff;text-shadow:0 2px 0 #0006;animation:pop .5s cubic-bezier(.3,1.6,.5,1) .1s backwards}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.fx .gs{font-size:clamp(16px,4.6vw,24px);font-weight:800;color:#fff}
.fx .ga{font-size:13px;color:#ffffffcc}
.fx .gsc{font-size:13px;font-weight:700;color:#fff;margin-top:2px}
.fx .pt{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:var(--c);opacity:0;animation:burst 1.1s ease-out var(--d) forwards;will-change:transform,opacity}
@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.mp{position:relative;height:46px;border-radius:10px;background:repeating-linear-gradient(90deg,#1d7a3b 0 40px,#22883f 40px 80px);border:2px solid #ffffff33;overflow:hidden;margin:6px 0}
.mp::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #ffffff44}
.mp .gp{position:absolute;top:30%;bottom:30%;width:8px;background:#ffffff88}
.mp .gp.l{left:0}.mp .gp.r{right:0}
.mp .ball{position:absolute;top:50%;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;transition:left .65s cubic-bezier(.4,.1,.2,1),top .65s}
.mp .ball.gl{animation:ballg .8s}
@keyframes ballg{50%{transform:scale(2.2)}}
.lcard{font-size:.9em}
.cup{margin-bottom:10px}
.tie{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:var(--panel2);border-radius:10px;padding:7px 9px;margin-bottom:5px;font-size:13px}
.tie.me{outline:1px solid var(--acc)}
.tie .r{text-align:right}
.tie .s{font-weight:900;min-width:58px;text-align:center;background:#0006;border-radius:8px;padding:2px 6px}
.w{font-weight:800;color:var(--acc)}
.rating{font-variant-numeric:tabular-nums;font-weight:800}
.rating.h{color:var(--acc)}.rating.l{color:var(--red)}
@media(prefers-reduced-motion:reduce){.card,.card *,.fx *{animation-duration:.01s!important}}

function pairMods(X,Y){
  let a=0,c=0;const sx=X.st,sy=Y.st,xl=X.lb,yl=Y.lb;
  if(sy.high>0)a+=sx.ex*2.2*Math.min(1,sy.high);else if(sy.high<0)a-=sx.ex*1.2;
  const pr=Math.max(0,sy.press);
  if(xl[15]==="Courte"||xl[15]==="Équilibrée")c-=pr*1.1;
  if(xl[15]==="Jouer à travers le pressing")c+=pr*.8;
  if(xl[15]==="Directe")a+=pr*.5;
  if(xl[25]==="Oui")c-=pr*.5;
  if(yl[26]==="Forcer l'adversaire vers l'extérieur"&&sx.axe)a-=.8;
  if(yl[26]==="Forcer l'adversaire vers l'intérieur"&&sx.wide>0)a-=.8;
  if(yl[27]==="Empêcher les centres")a-=sx.wide>0?1.2:.4;
  if(yl[27]==="Inviter l'adversaire à centrer")a+=sx.wide>0?1.5:.5;
  if(xl[13]==="Dans l'espace")a+=sy.high>0?1.2:sy.high<0?-.5:0;
  if(sy.press<0&&sx.dir<=-1)c+=1;
  return{a:a,c:c};
}

function coherence(l,s,cnt){

  if(s.dir<=-1.5){if(cnt.M>=2)add(true,"Deux milieux ou plus pour le jeu court.");else add(false,"Jeu court sans deux milieux.");}

const order=()=>["G"].concat(Array(S.formation[0]).fill("D"),Array(S.formation[1]).fill("M"),Array(S.formation[2]).fill("A"));
function minPos(pos){let m=1e9;P.forEach(p=>{if(p.pos===pos){const v=price(p);if(v<m)m=v;}});return m;}
function maxAfford(){const left=order().slice(S.round+1);const reserve=left.reduce((s,x)=>s+minPos(x),0);return unlimited()?1e9:S.budget-reserve;}
function genOffer(){
  const pos=order()[S.round];
  const k=DIFF[S.diff].rare*(1.25-T()[S.slot].rep/200);
  const max=maxAfford();
  let pool=P.filter(p=>p.pos===pos&&S.own[p.id]!==S.slot&&!S.shown.includes(p.id));
  if(pool.length<3){S.shown=[];pool=P.filter(p=>p.pos===pos&&S.own[p.id]!==S.slot);}
  const full=pool.slice(),out=[];
  let cand=pool.slice();
  for(let i=0;i<3&&cand.length;i++){
    const w=cand.map(p=>{const s=PS(p.id);return Math.exp(-(s.gen+.4*(s.pot-s.gen)-78)*k);});
    const idx=wpick(cand,w);out.push(cand.splice(idx,1)[0]);
  }
  if(!out.some(p=>price(p)<=max)){
    const ch=full.filter(p=>!out.includes(p)).sort((a,b)=>price(a)-price(b))[0];
    if(ch){out.sort((a,b)=>price(b)-price(a));out[0]=ch;}
  }
  shuffle(out);
  S.offer=out.map(p=>p.id);S.shown=S.shown.concat(S.offer);
}
function viewDraft(){
  const ord=order(),pos=ord[S.round],max=maxAfford();
  const picks=S.picks.map(id=>P[id]);
  const rows={A:[],M:[],D:[],G:[]};
  const cnt={G:1,D:S.formation[0],M:S.formation[1],A:S.formation[2]};
  ["A","M","D","G"].forEach(k=>{const have=picks.filter(p=>p.pos===k).map(p=>Object.assign({},p,{gen:PS(p.id).gen}));for(let i=0;i<cnt[k];i++)rows[k].push(have[i]||null);});
  const prog=ord.map((x,i)=>'<i class="'+(i<S.round?"done":i===S.round?"cur":"")+'"></i>').join("");
  const cards=S.offer.map((id,i)=>{
    const p=P[id],ok=price(p)<=max;
    return '<div class="cardcell">'+cardHTML(p,{i:i,act:ok?"pick":"locked",cls:ok?"":"locked"})+'<button class="btn" data-act="pick" data-id="'+id+'"'+(ok?"":" disabled")+">Recruter</button></div>";
  }).join("");
  return '<div class="top"><div class="who">'+badge(S.slot,true)+'<div><b>'+esc(T()[S.slot].name)+'</b><span class="mut">'+esc(S.mgr)+" · "+DIFF[S.diff].n+'</span></div></div>'

  +'<div class="panel" style="text-align:center"><div class="mut">Tour '+(S.round+1)+' / 5</div><div class="big">'+POS_EMO[pos]+" Choisis ton "+POS_LONG[pos].toLowerCase()+'</div><div class="progress">'+prog+"</div>"
  +(!unlimited()?'<div class="mut" style="font-size:13px">Tu peux dépenser jusqu\'à <b style="color:var(--gold)">'+fm(Math.max(0,max))+"</b> sur ce tour (le reste est réservé aux postes suivants).</div>":"")
  +'<div class="cards" id="cards">'+cards+'</div><button class="btn sec" data-act="refresh"'+(S.refreshes>=2?" disabled":"")+">🔄 Relancer le tirage ("+(2-S.refreshes)+" restant"+(2-S.refreshes>1?"s":"")+')</button>'
  +'<div class="mut" style="font-size:12px;margin-top:6px">À tes risques et périls : le nouveau tirage peut être pire. Les cartes ▲ Pépite ont un fort potentiel.</div></div>'
  +'<div class="panel"><h3 style="margin-bottom:8px">Ton 5 de départ</h3>'+pitchHTML(rows)+"</div>";

function doPick(id){
  const p=P[id];if(!S.offer.includes(id))return;

function makeFixtures(){

    const f=[];
    for(let i=0;i<10;i++){let h=arr[i],a=arr[19-i];if((r+i)%2===1){const x=h;h=a;a=x;}f.push({h:h,a:a});}
    rounds.push(f);

  }

function buildCal(){
  const after={LC:{4:0,10:1,17:2,25:3,28:4},FA:{6:0,13:1,20:2,29:3,36:4}};const cal=[];
  for(let d=0;d<38;d++){cal.push({k:"L",d:d});["LC","FA"].forEach(k=>{const s=after[k][d+1];if(s!=null)cal.push({k:k,s:s});});}

function ensureDraw(it){
  const c=S.cups[it.k];if(c.draw)return c.draw;
  const pool=shuffle(c.alive.slice()),ties=[];let byes=[];
  const mk=(x,y)=>{if(it.s===4||Math.random()<.5)ties.push({h:x,a:y});else ties.push({h:y,a:x});};
  if(it.s===0){byes=pool.slice(8);for(let i=0;i<8;i+=2)mk(pool[i],pool[i+1]);}
  else for(let i=0;i<pool.length;i+=2)mk(pool[i],pool[i+1]);
  c.draw={ties:ties,byes:byes};
  if(pool.includes(S.slot))c.reached=Math.max(c.reached,it.s);
  return c.draw;
}

function standIn(pos,base,k){

  return{id:-1,name:STAND[(hash(pos+k+base)%STAND.length)],pos:pos,club:-1,gen:g,pot:g,eff:g,role:"std",sub:true,form:formLab({mom:0,fat:0})};

function mkPl(id,role){
  const s=PS(id),p=P[id],f=formLab(s);
  return{id:id,name:p.name,pos:p.pos,club:p.club,gen:s.gen,pot:s.pot,eff:s.gen+f.m,role:role||"std",sub:false,form:f};

function getLineup(t){
  if(t===S.slot)return S.squad.map(id=>avail(id)?mkPl(id,S.roles[id]):Object.assign(standIn(P[id].pos,PS(id).gen,id),{repl:id}));
  const f=AI_FORMS[(t*7+3)%AI_FORMS.length],need={G:1,D:f[0],M:f[1],A:f[2]},L=[];
  ["G","D","M","A"].forEach(k=>{
    const have=P.filter(p=>S.own[p.id]===t&&p.pos===k&&avail(p.id)).sort((a,b)=>PS(b.id).gen-PS(a.id).gen);
    for(let i=0;i<need[k];i++)L.push(have[i]?mkPl(have[i].id):standIn(k,80,t+i));
  });
  return L;
}
function chemOf(L){const c={};L.forEach(p=>{if(p.club>=0)c[p.club]=(c[p.club]||0)+1;});let pairs=0;Object.values(c).forEach(v=>pairs+=v*(v-1)/2);return{pairs:pairs,v:Math.min(.03,pairs*.005)};}
function teamCtx(t){
  const L=getLineup(t),tac=S.tacs[t],lb=labels(tac),st=styleOf(lb),E=sumE(tac),cnt={G:0,D:0,M:0,A:0};
  let a=0,d=0,c=0,gk=70,off=0,def=0;
  L.forEach(p=>{
    const g=p.eff-50;cnt[p.pos]++;a+=g*WA[p.pos];d+=g*WD[p.pos];c+=g*WC[p.pos];
    if(p.pos==="G")gk=p.eff;
    const r=ROLES[p.pos][p.role||"std"]||ROLES[p.pos].std;a+=r.a*.8;d+=r.d*.8;c+=r.c*.8;if(r.off)off++;if(r.def)def++;
  });
  const balPen=off>=3&&def===0;
  const co=coherence(lb,st,cnt),ch=chemOf(L),rep=1+(T()[t].rep-60)/500;
  const coM=co.s>0?1.03:co.s<-1?.94:co.s<0?.97:1,chM=1+ch.v;
  a=(a+E.a*1.5)*coM*chM*rep;c=(c+E.c*1.5)*coM*chM*rep;
  d=(d+E.d*1.5)*(co.s<0?.97:1)*(1+ch.v/2)*(balPen?.95:1);
  return{t:t,L:L,a:a,d:d,c:c,gk:gk,E:E,lb:lb,st:st,co:co,ch:ch,balPen:balPen,cnt:cnt,cf:.1+E.cf,vol:E.vol,risk:E.risk,conv:E.conv,sp:E.sp,lsh:E.lsh,card:E.card,inj:E.inj,tw:E.tw};
}

const WSH={A:1,M:.45,D:.1,G:0},RB={fin:1.4,crea:1.25,lat:1.4,f9:1.2};
function pickShooter(X,sp,counter){
  const w=X.L.map(p=>{

const NB=14,PB=.34,CB=.27;
function injGames(){const r=Math.random();return r<.35?1:r<.7?ri(2,3):r<.92?ri(4,6):ri(7,12);}
function simMatch(h,a,o){
  o=o||{};const log=!!o.log;
  const H=teamCtx(h),A=teamCtx(a);H.side="h";A.side="a";
  const Hm=pairMods(H,A),Am=pairMods(A,H),nz=()=>1+rnd(-.055,.055);
  H.b={a:(H.a+Hm.a*1.5)*nz()*(o.neutral?1:1.02),d:H.d*nz(),c:(H.c+Hm.c*1.5)*nz()*(o.neutral?1:1.04)};
  A.b={a:(A.a+Am.a*1.5)*nz(),d:A.d*nz(),c:(A.c+Am.c*1.5)*nz()};
  const nm={h:T()[h].name,a:T()[a].name},col={h:T()[h].color,a:T()[a].color},sides={h:H,a:A},opp={h:A,a:H};
  const redAt={h:99,a:99},injAt={h:99,a:99},inc=[];
  ["h","a"].forEach(sd=>{
    const X=sides[sd],Y=opp[sd],yc={};
    const exp=clamp(1.3+X.card*.9,.4,3.2);let ny=0;for(let k=0;k<4;k++)if(Math.random()<exp/4)ny++;
    for(let k=0;k<ny;k++){
      const w=X.L.map((p,ix)=>(p.pos==="D"?1.3:p.pos==="M"?1.2:p.pos==="A"?.8:.25)*(yc[ix]?.12:1));
      const i=wpick(X.L,w),m=ri(6,89);
      yc[i]=(yc[i]||0)+1;
      if(yc[i]===2){inc.push({side:sd,type:"r2",i:i,m:m});redAt[sd]=Math.min(redAt[sd],m);}else inc.push({side:sd,type:"y",i:i,m:m});
    }
    if(Math.random()<.006*(1+Math.max(0,X.card))){
      const i=wpick(X.L,X.L.map(p=>p.pos==="G"?.2:1)),m=ri(18,88);
      if(!inc.some(x=>x.side===sd&&x.i===i&&x.type==="r2")){inc.push({side:sd,type:"r",i:i,m:m});redAt[sd]=Math.min(redAt[sd],m);}
    }
    X.L.forEach((p,i)=>{
      if(p.sub||p.id<0)return;const s=PS(p.id);
      const pr=.008*(1+s.fat/60)*(1+Y.inj*.6);
      if(Math.random()<pr){const m=ri(8,86);inc.push({side:sd,type:"inj",i:i,m:m,g:injGames()});injAt[sd]=Math.min(injAt[sd],m);}
    });
  });
  const N=clamp(Math.round(NB*(1+(H.vol+A.vol)*.8)),11,22),mins=[];
  for(let i=0;i<N;i++)mins.push(clamp(Math.round((i+.5)*(90/N)+rnd(-1.6,1.6)),1,90));
  mins.sort((x,y)=>x-y);
  let hg=0,ag=0,hs=0,as_=0,hp=0,ap=0;const ev=[],goals=[];
  function chance(X,Y,m,counter){
    const sp=!counter&&Math.random()<clamp(.12+X.sp*.05,.04,.35);
    const si=pickShooter(X,sp,counter),sh=X.L[si],r=ROLES[sh.pos][sh.role||"std"]||ROLES[sh.pos].std;
    if(X.side==="h")hs++;else as_++;
    const conv=clamp(CB+(sh.eff-Y.gk)/130+X.conv+(r.cv||0)+(counter?.03:0)-(sp?.02:0),.1,.55);
    const gkn=(Y.L.find(p=>p.pos==="G")||{name:"le gardien"}).name,gks=shortName(gkn),ss=shortName(sh.name);
    let type;
    if(Math.random()<conv){
      type="goal";if(X.side==="h")hg++;else ag++;
      const ai=Math.random()<.72?pickAssist(X,si):-1;
      goals.push({side:X.side,m:m,si:si,ai:ai,sid:sh.id,aid:ai>=0?X.L[ai].id:-1,sn:sh.name,an:ai>=0?X.L[ai].name:null});
    }else{const q=Math.random();type=q<.42?"save":q<.68?"miss":q<.82?"block":"post";}
    if(!log)return;
    const dpool=Y.L.filter(p=>p.pos==="D"||p.pos==="M"),dn=dpool.length?shortName(pick(dpool).name):"un défenseur";
    let txt,gl=type==="goal"?goals[goals.length-1]:null;
    if(type==="goal"){txt=pick(counter?TPL.counter:sp?TPL.sp:TPL.goal)(ss,gks);if(gl.an)txt+=" Passe décisive de "+shortName(gl.an)+".";}
    else if(type==="block")txt=pick(TPL.block)(ss,gks,dn);else txt=pick(TPL[type])(ss,gks);
    ev.push({t:m,m:m,type:type,side:X.side,col:col[X.side],txt:txt,sn:gl?gl.sn:null,an:gl?gl.an:null});
  }
  for(let i=0;i<N;i++){
    const m=mins[i];
    const mh=(m>=redAt.h?.86:1)*(m>=injAt.h?.93:1),ma=(m>=redAt.a?.86:1)*(m>=injAt.a?.93:1);
    const hc=H.b.c*mh,ac=A.b.c*ma,homeAtt=Math.random()<hc/(hc+ac);
    const X=homeAtt?H:A,Y=homeAtt?A:H,mx=homeAtt?mh:ma,my=homeAtt?ma:mh;
    if(homeAtt)hp++;else ap++;
    const lead=(Y.side==="h"?hg-ag:ag-hg)>0&&m>55?Y.tw:0;
    const pc=clamp(PB+(X.b.a*mx-Y.b.d*my)/200+Y.risk*1.1-lead*.03,.14,.72);
    if(Math.random()<pc)chance(X,Y,m,false);
    else if(Math.random()<Y.cf*.5*(1+Math.max(0,X.risk)*4))chance(Y,X,m,true);
    else if(log&&Math.random()<.3)ev.push({t:m,m:m,type:"info",side:X.side,col:col[X.side],txt:pick(TPL.info)(nm[X.side])});
  }
  const sched=[];
  inc.forEach(x=>{
    const X=sides[x.side],pl=X.L[x.i];x.id=pl.id;x.sub=!!pl.sub;x.name=pl.name;
    if(!log)return;
    let txt,type;
    if(x.type==="y"){type="card";txt="🟨 Carton jaune pour "+pl.name+" ("+nm[x.side]+") après un tacle appuyé.";}
    else if(x.type==="r2"){type="red";txt="🟥 Second jaune ! "+pl.name+" ("+nm[x.side]+") est expulsé.";}
    else if(x.type==="r"){type="red";txt="🟥 Rouge direct pour "+pl.name+" ("+nm[x.side]+") ! L'équipe termine à 4.";}
    else{type="inj";txt="🚑 "+pl.name+" ("+nm[x.side]+") se blesse et ne peut pas poursuivre (absence estimée : "+x.g+" match"+(x.g>1?"s":"")+").";}
    ev.push({t:x.m+.2,m:x.m,type:type,side:x.side,col:col[x.side],txt:txt});
  });
  if(log){
    ev.push({t:45.5,type:"ht"});ev.push({t:90.9,type:"ft"});
    ev.sort((x,y)=>x.t-y.t);
    let ch2=0,ca=0;ev.forEach(e=>{if(e.type==="goal"){if(e.side==="h")ch2++;else ca++;}e.hg=ch2;e.ag=ca;});
  }
  const rt={h:[],a:[]};
  ["h","a"].forEach(sd=>{
    const gf=sd==="h"?hg:ag,gaa=sd==="h"?ag:hg;
    rt[sd]=sides[sd].L.map((p,i)=>{
      let r=6.2+rnd(-.5,.5)+goals.filter(x=>x.side===sd&&x.si===i).length*1.0+goals.filter(x=>x.side===sd&&x.ai===i).length*.6+(gf>gaa?.45:gf<gaa?-.35:0);
      if(p.pos==="D"||p.pos==="G")r+=gaa===0?.6:gaa>=3?-.5:0;
      if(inc.some(x=>x.side===sd&&x.i===i&&(x.type==="r"||x.type==="r2")))r-=1.2;
      return clamp(r,4.5,10);
    });
  });
  const res={h:h,a:a,hg:hg,ag:ag,ev:ev,hs:hs,as:as_,poss:Math.round(hp/Math.max(1,hp+ap)*100),goals:goals,inc:inc,rt:rt,_L:{h:H.L,a:A.L},_g:{h:H.gk,a:A.gk},log:log,neutral:!!o.neutral};
  if(log){
    res.sum=summary(nm.h,nm.a,hg,ag,hs,as_);
    let best=null;["h","a"].forEach(sd=>sides[sd].L.forEach((p,i)=>{if(!best||rt[sd][i]>best.r)best={r:rt[sd][i],n:p.name,sd:sd};}));
    res.motm=best?{n:best.n,r:Math.round(best.r*10)/10,sd:best.sd}:null;
    res.lu={h:H.L.map((p,i)=>({n:p.name,pos:p.pos,r:rt.h[i],g:goals.filter(x=>x.side==="h"&&x.si===i).length,a:goals.filter(x=>x.side==="h"&&x.ai===i).length,sub:!!p.sub})),
            a:A.L.map((p,i)=>({n:p.name,pos:p.pos,r:rt.a[i],g:goals.filter(x=>x.side==="a"&&x.si===i).length,a:goals.filter(x=>x.side==="a"&&x.ai===i).length,sub:!!p.sub}))};
  }
  return res;
}
function summary(hn,an,hg,ag,hs,as){
  const d=hg-ag,tot=hg+ag;
  if(d===0){
    if(tot===0)return "Un 0-0 verrouillé : les défenses ont pris le dessus et personne n'a vraiment trouvé la faille.";
    if(tot>=4)return "Un nul spectaculaire : les deux équipes se sont rendu coup pour coup.";
    return "Un partage des points logique au terme d'une partie équilibrée.";
  }
  const w=d>0?hn:an,l=d>0?an:hn,m=Math.abs(d),ws=d>0?hs:as,ls=d>0?as:hs;
  if(m===1)return ws<ls?w+" s'impose avec réalisme face à "+l+", pourtant plus dangereux dans les tirs.":w+" arrache une courte victoire face à "+l+" au terme d'un match disputé.";
  if(m===2)return "Victoire méritée de "+w+" contre "+l+", plus solide dans les moments clés.";
  return w+" écrase "+l+" : une démonstration collective.";
}
function shootout(r,log){
  const H=r._L.h,A=r._L.a,tk=L=>L.slice().sort((x,y)=>y.eff-x.eff);
  const th=tk(H),ta=tk(A);let ph=0,pa=0,k=0,t0=92;r.pev=[];
  const kick=(side,i)=>{
    const sh=(side==="h"?th:ta)[i%5>=(side==="h"?th:ta).length?0:i%5],gk=side==="h"?r._g.a:r._g.h;
    const ok=Math.random()<clamp(.74+(sh.eff-gk)/250,.55,.92);
    if(ok){if(side==="h")ph++;else pa++;}
    if(log)r.pev.push({t:t0+=.6,type:"pen",side:side,col:T()[side==="h"?r.h:r.a].color,txt:(ok?"✅ ":"❌ ")+shortName(sh.name)+(ok?" transforme son tir au but.":" rate son tir au but !"),ph:ph,pa:pa,hg:r.hg,ag:r.ag});
  };
  for(let i=0;i<5;i++){kick("h",i);kick("a",i);}
  let n=5;while(ph===pa&&n<15){kick("h",n);kick("a",n);n++;}
  if(ph===pa){if(Math.random()<.5)ph++;else pa++;}
  r.ph=ph;r.pa=pa;r.pw=ph>pa?r.h:r.a;
  if(log){r.ev=r.ev.concat(r.pev);r.sum=(r.sum||"")+" Qualification aux tirs au but ("+ph+"-"+pa+") pour "+T()[r.pw].name+".";}
}

/* =================== APRÈS-MATCH : FORME, BLESSURES, PROGRESSION =================== */
function tick(playedT){
  P.forEach(p=>{
    const s=PS(p.id);
    if(s.inj>0)s.inj--;
    const own=S.own[p.id];
    if(s.sus>0&&own>=0&&playedT.has(own))s.sus--;
  });
}
function postMatch(r,playedIds){
  ["h","a"].forEach(sd=>{
    const L=r._L[sd],gf=sd==="h"?r.hg:r.ag,gaa=sd==="h"?r.ag:r.hg,tm=sd==="h"?r.h:r.a;
    L.forEach((p,i)=>{
      if(p.id<0)return;const s=PS(p.id);playedIds.add(p.id);
      const g=r.goals.filter(x=>x.side===sd&&x.si===i).length,a=r.goals.filter(x=>x.side===sd&&x.ai===i).length,rt=r.rt[sd][i];
      s.gp++;s.g+=g;s.a+=a;s.rs+=rt;s.rn++;
      const win=gf>gaa?1:gf<gaa?-1:0;
      s.mom=clamp(s.mom*.85+g*.9+a*.5+win*.35+(rt-6.5)*.35+rnd(-.3,.3),-3,3);
      s.fat=clamp(s.fat+4-3,0,70)+(r.cupx?0:0);
      if(s.gen<s.pot){
        const f=clamp((s.pot-s.gen)/5,.3,1.5);
        s.xp+=(.17+Math.max(0,rt-6.3)*.09+Math.max(0,s.mom-s.fat/40)*.04)*f;
        if(s.xp>=5.5){s.xp-=5.5;s.gen++;
          if(S.own[p.id]===S.slot){S.gainSeason++;news("📈 "+p.name+" progresse : GEN "+s.gen+" (POT "+s.pot+")");}}
      }
    });
  });
  r.inc.forEach(x=>{
    if(x.id<0||x.sub)return;const s=PS(x.id),mine=S.own[x.id]===S.slot;
    if(x.type==="y"){s.yc++;if(s.yc>=5){s.yc=0;s.sus=Math.max(s.sus,1);if(mine)news("🟨 "+P[x.id].name+" suspendu 1 match (5 jaunes).");}}
    else if(x.type==="r"||x.type==="r2"){const g=x.type==="r2"?1:ri(1,3);s.sus=Math.max(s.sus,g);if(mine)news("🟥 "+P[x.id].name+" expulsé : "+g+" match"+(g>1?"s":"")+" de suspension.");}
    else if(x.type==="inj"){s.inj=Math.max(s.inj,x.g);s.mom=clamp(s.mom-.5,-3,3);if(mine)news("🚑 "+P[x.id].name+" blessé : "+x.g+" match"+(x.g>1?"s":"")+" d'absence.");}
  });
  delete r._L;delete r._g;
}
function restOthers(played){P.forEach(p=>{if(!played.has(p.id)){const s=PS(p.id);s.fat=Math.max(0,s.fat-6);s.mom*=.92;}});}

/* =================== TOUR DE CALENDRIER =================== */
function nextInfo(){
  const it=S.cal[S.ci];if(!it)return null;
  if(it.k==="L"){const f=S.fixtures[it.d].find(x=>x.h===S.slot||x.a===S.slot);return{it:it,h:f.h,a:f.a,inv:true};}
  const dr=ensureDraw(it),t=dr.ties.find(x=>x.h===S.slot||x.a===S.slot);
  if(t)return{it:it,h:t.h,a:t.a,inv:true};
  return{it:it,inv:false,bye:dr.byes.includes(S.slot)};
}
function playItem(){
  const it=S.cal[S.ci];if(!it)return null;
  const results=[],playedT=new Set();let mine=null;
  if(it.k==="L"){
    S.fixtures[it.d].forEach(f=>{
      const isMe=f.h===S.slot||f.a===S.slot,r=simMatch(f.h,f.a,{log:isMe});r.comp=dayLabel(it);r.day=it.d;
      results.push(r);playedT.add(f.h);playedT.add(f.a);if(isMe)mine=r;
    });
  }else{
    const dr=ensureDraw(it);
    dr.ties.forEach(t=>{
      const isMe=t.h===S.slot||t.a===S.slot,r=simMatch(t.h,t.a,{log:isMe,neutral:it.s===4});r.comp=dayLabel(it);r.day=S.day;r.cup=it.k;
      if(r.hg===r.ag)shootout(r,isMe);
      r.w=r.hg>r.ag?t.h:r.hg<r.ag?t.a:r.pw;
      results.push(r);playedT.add(t.h);playedT.add(t.a);if(isMe)mine=r;
    });
  }
  const playedIds=new Set();
  tick(playedT);
  results.forEach(r=>{
    postMatch(r,playedIds);
    if(r.cup){const extra=r.hg===r.ag?1:0;}
  });
  restOthers(playedIds);
  if(it.k==="L"){results.forEach(r=>applyResult(r.h,r.a,r.hg,r.ag));S.results[it.d]=results.map(r=>({h:r.h,a:r.a,hg:r.hg,ag:r.ag}));S.day++;}
  else cupAdvance(it,results);
  S.ci++;
  if(mine){userAfter(mine,it);S.history.push(slim(mine));}
  if(S.ci>=S.cal.length)finishSeason();
  return mine;
}
function cupAdvance(it,results){
  const c=S.cups[it.k],dr=c.draw,win=results.map(r=>r.w);
  c.rounds.push({s:it.s,ties:results.map(r=>({h:r.h,a:r.a,hg:r.hg,ag:r.ag,ph:r.ph,pa:r.pa,w:r.w}))});
  c.alive=win.concat(dr.byes);c.draw=null;
  if(it.s===4){c.winner=win[0];if(win[0]===S.slot)c.reached=5;}
  if(!c.alive.includes(S.slot)&&!c.out&&!(it.s===4&&win[0]===S.slot))c.out=STG[it.s];
}
function userAfter(m,it){
  const me=m.h===S.slot?"h":"a",gf=me==="h"?m.hg:m.ag,gaa=me==="h"?m.ag:m.hg;
  let my=gf>gaa?1:gf<gaa?-1:0;if(my===0&&m.w!=null)my=m.w===S.slot?1:-1;
  m.res=my>0?"W":my<0?"L":"D";
  const rp=T()[S.slot],dm=DIFF[S.diff].cm;
  rp.rep=clamp(rp.rep+(my>0?.4:my<0?-.3:.05),20,99);
  if(it.k==="L"){
    if(!unlimited())S.budget+=my>0?5:my===0?3:2;
    S.board.conf=clamp(S.board.conf+(my>0?1.6/(dm>1?dm:1)*(S.diff==="easy"?.8:1):my<0?-1.4*dm:.1),0,100);
  }else{
    if(my>0&&!unlimited())S.budget+=3;
    S.board.conf=clamp(S.board.conf+(my>0?1:-.8*dm),0,100);
  }
}
function slim(m){return{h:m.h,a:m.a,hg:m.hg,ag:m.ag,ev:m.ev,hs:m.hs,as:m.as,poss:m.poss,goals:m.goals,sum:m.sum,comp:m.comp,day:m.day,ph:m.ph,pa:m.pa,w:m.w,lu:m.lu,motm:m.motm,res:m.res,cup:m.cup};}
function finishSeason(){
  if(S.endInfo)return;
  const rank=myRank(),dm=DIFF[S.diff].cm;

  const objs=S.board.obj.map(o=>{const e=objEval(o,false);return'<div class="obj '+e.st+'"><span class="ic">'+(e.st==="ok"?"✅":e.st==="ko"?"❌":"⏳")+'</span><div><b>'+esc(o.t)+'</b><div class="mut" style="font-size:12px">'+esc(e.note)+"</div></div></div>";}).join("");
  const conf=Math.round(S.board.conf),cc=conf>=60?"var(--acc)":conf>=35?"var(--gold)":"var(--red)";
  const hist=S.champs.length?S.champs.map(c=>'<div class="news">Saison '+c.s+' : 🏆 '+esc(T()[c.t].name)+" · FA : "+(c.fa!=null?esc(T()[c.fa].name):"—")+" · Carabao : "+(c.lc!=null?esc(T()[c.lc].name):"—")+"</div>").join(""):'<p class="mut">Pas encore de saison terminée.</p>';
  const rule=S.diff==="easy"?"Mode Facile : le board est très souple et ne te limogera jamais.":S.diff==="normal"?"Mode Normal : tu es limogé si la confiance tombe sous 25 % en fin de saison.":"Mode Difficile : tu es limogé si la confiance tombe sous 35 % en fin de saison.";
  return '<div class="panel"><h3 style="margin-bottom:8px">🏛️ Confiance du board</h3><div class="meter" style="height:16px"><i style="width:'+conf+"%;background:"+cc+'"></i></div><div class="row between" style="margin-top:6px"><b style="color:'+cc+'">'+conf+' %</b><span class="mut" style="font-size:12px">'+rule+"</span></div></div>"
  +'<div class="panel"><h3 style="margin-bottom:8px">🎯 Objectifs de la saison '+S.season+"</h3>"+objs+'<p class="mut" style="font-size:12px">Chaque objectif atteint : +7 % de confiance et +8 M€ de prime en fin de saison. Chaque échec coûte de la confiance.</p></div>'
  +'<div class="panel"><h3 style="margin-bottom:8px">📜 Palmarès</h3>'+hist+"</div>";
}
function viewHub(){
  const v={match:viewMatch,tactic:viewTactic,squad:viewSquad,market:viewMarket,comp:viewComp,board:viewBoard}[S.tab]();
  return header()+navHTML()+v+viewModal();
}
function viewEnd(){
  const e=S.endInfo||(finishSeason(),S.endInfo);
  const verdict=e.rank===1?"🏆 CHAMPION D'ANGLETERRE !":e.rank<=4?"🌟 Qualifié en Ligue des champions":e.rank===5?"✨ Qualifié en Europa League":e.rank>=18?"😬 Saison catastrophique":"Saison honorable";
  const top=e.top.map((r,i)=>'<tr'+(r.t===S.slot?' class="me"':"")+"><td>"+(i+1)+'</td><td class="l"><span class="tn">'+badge(r.t)+esc(T()[r.t].name)+"</span></td><td>"+r.pts+"</td></tr>").join("");
  const objs=e.objs.map(o=>'<div class="obj '+o.st+'"><span class="ic">'+(o.st==="ok"?"✅":"❌")+"</span><div><b>"+esc(o.t)+'</b><div class="mut" style="font-size:12px">'+esc(o.note)+"</div></div></div>").join("");
  return '<div class="hero"><div class="logo">Bilan de saison '+S.season+'</div></div>'
  +'<div class="panel" style="text-align:center"><div class="big">'+verdict+"</div><p>"+esc(T()[S.slot].name)+" termine <b>"+e.rank+"e</b> avec <b>"+e.me.pts+"</b> points ("+e.me.w+"V "+e.me.d+"N "+e.me.l+"D, "+e.me.gf+"-"+e.me.ga+').</p>'
  +'<p class="mut">Champion : '+esc(T()[e.champ].name)+" ("+e.champPts+" pts) · FA Cup : "+(e.fa!=null?esc(T()[e.fa].name):"—")+" · Carabao Cup : "+(e.lc!=null?esc(T()[e.lc].name):"—")+"</p>"
  +(e.prize?'<p>Primes de fin de saison : <b style="color:var(--gold)">'+fm(e.prize)+"</b></p>":"")+"</div>"
  +'<div class="panel"><h3 style="margin-bottom:8px">🎯 Objectifs du board ('+e.done+"/"+e.objs.length+")</h3>"+objs+'<p>Confiance du board : <b>'+Math.round(S.board.conf)+" %</b></p></div>"
  +'<div class="panel"><table><thead><tr><th>#</th><th class="l">Club</th><th>Pts</th></tr></thead><tbody>'+top+"</tbody></table></div>"
  +(e.fired?'<div class="alert"><b>🚪 Le board te limoge !</b><br>La confiance est trop basse. Ta carrière s\'arrête ici.</div><div class="row" style="justify-content:center"><button class="btn" data-act="newGame">Nouvelle partie</button></div>'
  :'<div class="row" style="justify-content:center"><button class="btn" data-act="nextSeason">Saison suivante ▶</button><button class="btn sec" data-act="newGame">Nouvelle partie</button></div>');
}

/* =================== DIRECT : HORLOGE rAF, BUT, MINI-TERRAIN =================== */
function startLive(m){
  LIVE={m:m,i:0,t:0,speed:1,pause:0,last:performance.now(),raf:0,lastMin:-1,hdr:LIVE_HDR,mySide:m.h===S.slot?"h":"a"};
  render(false);window.scrollTo(0,0);
  LIVE.raf=requestAnimationFrame(liveLoop);
}
let LIVE_HDR=null;
function liveLoop(ts){
  if(!LIVE)return;
  const dt=Math.min(ts-LIVE.last,60);LIVE.last=ts;
  if(LIVE.pause>0)LIVE.pause-=dt;
  else{
    LIVE.t+=dt/1000*2.4*LIVE.speed;
    const ev=LIVE.m.ev;
    while(LIVE.i<ev.length&&ev[LIVE.i].t<=LIVE.t){const e=ev[LIVE.i++];fire(e);if(LIVE.pause>0)break;}
    const mn=Math.min(90,Math.floor(LIVE.t));
    if(mn!==LIVE.lastMin){LIVE.lastMin=mn;const c=$("#lclk");if(c)c.textContent=LIVE.t>=92?"Tirs au but":mn+"'";}
    if(LIVE.i>=ev.length&&LIVE.t>=91){setTimeout(()=>{if(LIVE)endLive();},900);LIVE.t=-1e9;LIVE.pause=1e9;}
  }
  LIVE.raf=requestAnimationFrame(liveLoop);
}
function setBall(side,type){
  const b=$("#ball");if(!b)return;
  let x=50,y=50;
  if(["goal","save","miss","post","block"].indexOf(type)>=0){x=side==="h"?88:12;y=type==="goal"?50:rnd(30,70);}
  else if(type==="pen"){x=side==="h"?88:12;y=50;}
  else{x=clamp(50+(side==="h"?1:-1)*rnd(-5,30),12,88);y=rnd(25,75);}
  b.style.left=x+"%";b.style.top=y+"%";
  if(type==="goal"){b.classList.remove("gl");void b.offsetWidth;b.classList.add("gl");}
}
function fire(e){
  const feed=$("#lfeed");
  if(feed){feed.insertAdjacentHTML("afterbegin",evHTML(e));while(feed.children.length>40)feed.lastChild.remove();}
  if(e.side)setBall(e.side,e.type);
  if(e.type==="goal"){
    const sc=$("#lsc");if(sc){sc.textContent=e.hg+" - "+e.ag;sc.classList.remove("pulse");void sc.offsetWidth;sc.classList.add("pulse");}
    goalFX(e);LIVE.pause=LIVE.speed>=4?900:2300;
  }
  if(e.type==="red"||e.type==="inj"){LIVE.pause=600;}
  if(e.type==="pen"){const sc=$("#lsc");if(sc)sc.textContent=e.hg+" - "+e.ag+"  ("+e.ph+"-"+e.pa+")";LIVE.pause=500;}
}
function goalFX(e){
  const box=$("#fx");if(!box)return;
  const mine=e.side===LIVE.mySide,tc=mine?"#12a85c":"#c8283a",m=LIVE.m;
  let pts="";const cols=["#ffd84a","#ffffff",mine?"#7dffb4":"#ff9aa5"];
  for(let i=0;i<26;i++){const ang=Math.random()*Math.PI*2,dist=90+Math.random()*190;pts+='<i class="pt" style="--dx:'+Math.round(Math.cos(ang)*dist)+"px;--dy:"+Math.round(Math.sin(ang)*dist)+"px;--d:"+Math.round(Math.random()*160)+"ms;--c:"+cols[i%3]+'"></i>';}
  box.style.setProperty("--tc",tc);
  box.innerHTML='<div class="flash"></div><div class="banner"><div class="gl">⚽ BUT !</div><div class="gs">'+esc(e.sn||"")+"</div>"+(e.an?'<div class="ga">Passe décisive : '+esc(e.an)+"</div>":"")+'<div class="gsc">'+esc(T()[m.h].name)+" "+e.hg+" - "+e.ag+" "+esc(T()[m.a].name)+"</div></div>"+pts;
  box.classList.add("on");
  clearTimeout(box._t);box._t=setTimeout(()=>{box.classList.remove("on");box.innerHTML="";},2350);
  const lb=$("#livebox");if(lb){lb.classList.remove("shake");void lb.offsetWidth;lb.classList.add("shake");}
  try{if(navigator.vibrate)navigator.vibrate(mine?[60,40,60]:[140]);}catch(x){}
}
function endLive(){if(LIVE){cancelAnimationFrame(LIVE.raf);LIVE=null;}render(false);}

/* =================== ACTIONS =================== */
function toast(msg,bad){
  const t=document.createElement("div");t.className="toast"+(bad?" bad":"");t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2600);
}
const ACT={
  setDiff(el){SU.diff=el.dataset.v;render();},
  start(){
    const first=SU.first.trim(),last=SU.last.trim(),club=SU.club.trim();
    if(!first||!last||!club){const e=$("#err");if(e)e.textContent="Renseigne le prénom, le nom du manager et le nom du club.";return;}
    const slot=+SU.slot,d=DIFF[SU.diff];
    S={v:2,screen:"draft",mgr:first+" "+last,club:club,slot:slot,diff:SU.diff,formation:FORMS[+SU.form],teams:CLUBS.map(c=>({name:c.name,code:c.code,color:c.color,rep:c.rep})),own:[],pl:P.map(newPS),
       round:0,picks:[],offer:[],shown:[],refreshes:0,budget:d.budget,tacs:PRESET.map(x=>x.slice()),roles:{},squad:[],day:0,ci:0,cal:[],fixtures:[],table:[],results:[],history:[],
       tab:"match",sub:"table",season:1,mk:{pos:"all",n:30,sort:"gen"},modal:null,viewDay:null,busy:false,news:[],champs:[],board:{conf:d.conf,obj:[]},cups:null,gainSeason:0,endInfo:null};
    S.teams[slot]={name:club,code:club.replace(/[^A-Za-zÀ-ÿ]/g,"").slice(0,3).toUpperCase()||"MOI",color:SU.color,rep:d.rep,user:true};
    S.own=P.map(p=>p.club===slot?-1:p.club);
    genOffer();render(false);
  },
  continue(){const sv=loadSave();if(sv&&sv.v===2){S=sv;S.busy=false;S.modal=null;render(false);}},
  pick(el){if(S.busy)return;doPick(+el.dataset.id);},
  locked(el){if(el.classList.contains("card")){el.classList.add("shake");setTimeout(()=>el.classList.remove("shake"),420);toast("Budget insuffisant pour cette carte",true);}},
  refresh(){if(S.busy||S.refreshes>=2)return;S.refreshes++;genOffer();render(false);},
  tab(el){if(LIVE){cancelAnimationFrame(LIVE.raf);LIVE=null;}S.tab=el.dataset.v;render(false);window.scrollTo(0,0);},
  sub(el){S.sub=el.dataset.v;render();},
  play(){
    if(LIVE||!S.cal[S.ci])return;
    LIVE_HDR={day:S.day,rank:myRank()};
    const m=playItem();
    if(m){S.tab="match";startLive(m);}else render();
  },
  simOne(){if(LIVE)return;playItem();render();if(S.ci>=S.cal.length)toast("Saison terminée !");},
  speed(el){if(!LIVE)return;LIVE.speed=+el.dataset.v;document.querySelectorAll(".spd").forEach(b=>b.classList.toggle("on",b===el));},
  skipLive(){endLive();},
  simAll(){if(LIVE)return;if(!confirm("Simuler toutes les journées et coupes restantes ?"))return;playAll();render(false);window.scrollTo(0,0);},
  toEnd(){finishSeason();S.screen="end";render(false);window.scrollTo(0,0);},
  loadPreset(){const sel=$("#presetSel");if(!sel)return;S.tacs[S.slot]=PRESET[+sel.value].slice();toast("Style de "+CLUBS[+sel.value].name+" appliqué");render();},
  resetTac(){S.tacs[S.slot]=PRESET[S.slot].slice();toast("Tactique d'origine rétablie");render();},
  mkpos(el){S.mk.pos=el.dataset.v;S.mk.n=30;render();},
  mksort(el){S.mk.sort=el.dataset.v;S.mk.n=30;render();},
  mkmore(){S.mk.n+=30;render();},
  buy(el){S.modal={id:+el.dataset.id};render();},
  closeModal(el,e){if(e.target===el||e.target.classList.contains("btn")){S.modal=null;render();}},
  confirmBuy(el){
    const np=P[S.modal.id],old=P[+el.dataset.id],net=mkPrice(np)-sellPrice(old);
    if(!unlimited()&&net>S.budget){toast("Budget insuffisant",true);return;}
    if((np.pos==="G")!==(old.pos==="G"))return;
    if(!unlimited())S.budget-=net;
    S.own[old.id]=-1;S.own[np.id]=S.slot;
    S.squad=sortSquad(S.squad.filter(id=>id!==old.id).concat([np.id]));
    delete S.roles[old.id];
    S.modal=null;toast(np.name+" rejoint ton équipe !");render();
  },
  nextSeason(){
    const e=S.endInfo;if(!e||e.fired)return;
    const rank=e.rank,tm=T()[S.slot];
    tm.rep=clamp(tm.rep+(rank===1?6:rank<=4?3:rank>=18?-4:0),20,99);
    P.forEach(p=>{const s=PS(p.id);
      if(s.gen<s.pot&&Math.random()<(s.pot-s.gen)/9)s.gen++;
      s.inj=0;s.sus=0;s.yc=0;s.fat=0;s.mom=rnd(-.6,.6);s.gp=0;s.g=0;s.a=0;s.rs=0;s.rn=0;});
    S.season++;startSeason();S.screen="hub";S.tab="match";S.news=[];
    news("🆕 Nouvelle saison : intersaison terminée, les jeunes ont progressé.");
    render(false);window.scrollTo(0,0);
  },
  newGame(){if(!confirm("Abandonner cette partie et recommencer ?"))return;clearSave();S=null;LIVE=null;SU.diff="normal";render(false);window.scrollTo(0,0);}
};
const CHG={
  role(el){S.roles[+el.dataset.id]=el.value;render();},
  tac(el){S.tacs[S.slot][+el.dataset.i]=+el.value;render();},
  resday(el){S.viewDay=+el.value;render();}
};

/* =================== RENDU =================== */
function render(keep){
  const app=$("#app"),y=window.scrollY;
  if(!S||S.screen==="setup")app.innerHTML=viewSetup();
  else if(S.screen==="draft")app.innerHTML=viewDraft();
  else if(S.screen==="end")app.innerHTML=viewEnd();
  else app.innerHTML=viewHub();
  if(keep!==false)window.scrollTo(0,y);
  if(S)save();
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const f=ACT[el.dataset.act];if(f)f(el,e);
});
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-chg]");
  if(el&&CHG[el.dataset.chg]){CHG[el.dataset.chg](el);return;}
  const f=e.target.dataset&&e.target.dataset.f;if(f&&e.target.tagName==="SELECT")SU[f]=e.target.value;
});
document.addEventListener("input",e=>{const f=e.target.dataset&&e.target.dataset.f;if(f)SU[f]=e.target.value;});
let tiltRaf=0;
document.addEventListener("pointermove",e=>{
  if(e.pointerType==="touch")return;const c=e.target.closest&&e.target.closest(".card");if(!c)return;
  const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  cancelAnimationFrame(tiltRaf);
  tiltRaf=requestAnimationFrame(()=>{c.style.setProperty("--ry",((x-.5)*14).toFixed(1)+"deg");c.style.setProperty("--rx",((.5-y)*14).toFixed(1)+"deg");c.style.setProperty("--mx",(x*100).toFixed(0)+"%");c.style.setProperty("--my",(y*100).toFixed(0)+"%");});
});
document.addEventListener("pointerout",e=>{const c=e.target.closest&&e.target.closest(".card");if(c&&!c.contains(e.relatedTarget)){c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg");}});
window.__PL5={get S(){return S;},ACT:ACT,simMatch:simMatch,render:render,SU:SU,P:P,PRESET:PRESET,INS:INS,teamCtx:teamCtx,playItem:playItem,playAll:playAll,myRank:myRank,sortedTable:sortedTable,CLUBS:CLUBS,formLab:formLab,LIVE:()=>LIVE};
render(false);
})();
</script>
